<!doctype html>
<html lang="zh-CN" class="electron-light" data-codex-window-type="electron">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incodex Capture Window Preview</title>
    <link rel="stylesheet" href="/capture-window.css" />
    <style>
      :root {
        --spacing: 4px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --radius-xl: 12px;
        --radius-2xl: 16px;
        --radius-3xl: 20px;
        --height-toolbar: 46px;
        --height-token-nav-row: 32px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 14px;
        --font-weight-medium: 500;
        --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --transition-duration-basic: 150ms;
        --max-app-overlay-z-index: 2147480000;
      }

      .electron-light {
        --color-surface: #ffffff;
        --color-surface-elevated-secondary: #ffffff;
        --color-surface-secondary: #f7f7f7;
        --color-surface-tertiary: #eeeeee;
        --color-background-surface-under: #e8e8e8;
        --color-text: #202123;
        --color-text-secondary: #666a70;
        --color-text-tertiary: #8f949b;
        --color-text-disabled: #b6b9be;
        --color-border: #2021231a;
        --color-border-strong: #20212333;
        --color-background-primary-ghost-hover: #2021230d;
        --color-background-primary-ghost-active: #20212314;
        --color-background-primary-solid: #202123;
        --color-text-primary-solid: #ffffff;
        --color-ring: #0877d1;
        --shadow-2xl: 0 24px 80px #0000002b;
      }

      .electron-dark {
        --color-surface: #202123;
        --color-surface-elevated-secondary: #26282b;
        --color-surface-secondary: #1b1c1e;
        --color-surface-tertiary: #2c2e32;
        --color-background-surface-under: #111214;
        --color-text: #f2f2f2;
        --color-text-secondary: #b7bac0;
        --color-text-tertiary: #8d9299;
        --color-text-disabled: #62676d;
        --color-border: #ffffff1c;
        --color-border-strong: #ffffff33;
        --color-background-primary-ghost-hover: #ffffff12;
        --color-background-primary-ghost-active: #ffffff1c;
        --color-background-primary-solid: #f2f2f2;
        --color-text-primary-solid: #202123;
        --color-ring: #4ca6e8;
        --shadow-2xl: 0 24px 80px #00000073;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      html {
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/preview.js"></script>
  </body>
</html>
