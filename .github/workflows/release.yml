name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build and check
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${GITHUB_SHA}"
          export SOURCE_COMMIT
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a 40-character hex SHA" >&2; exit 1; }
          bun run build:runtime

          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must be vX.Y.Z: $TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          PACKAGE_VERSION=$(bun -e 'process.stdout.write(require("./package.json").version)')
          CARGO_VERSION=$(awk '
            $0 == "[workspace.package]" { workspace = 1; next }
            workspace && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
            workspace && /^\[/ { exit }
          ' Cargo.toml)
          RUNTIME_VERSION=$(bun -e 'process.stdout.write(require("./dist/runtime-manifest.json").runtimeVersion)')
          BUILT_SOURCE_COMMIT=$(bun -e 'process.stdout.write(require("./dist/runtime-manifest.json").sourceCommit)')
          [[ "$PACKAGE_VERSION" == "$VERSION" ]] || { echo "package.json version $PACKAGE_VERSION does not match $TAG" >&2; exit 1; }
          [[ "$CARGO_VERSION" == "$VERSION" ]] || { echo "Cargo workspace version $CARGO_VERSION does not match $TAG" >&2; exit 1; }
          [[ "$RUNTIME_VERSION" == "$VERSION" ]] || { echo "Runtime version $RUNTIME_VERSION does not match $TAG" >&2; exit 1; }
          [[ "$BUILT_SOURCE_COMMIT" == "$SOURCE_COMMIT" ]] || { echo "Runtime sourceCommit $BUILT_SOURCE_COMMIT does not match GITHUB_SHA $SOURCE_COMMIT" >&2; exit 1; }

          bun run typecheck
          bun run lint
          bun test src tests
          cargo test --locked --workspace --release
      - name: Compile native CLI
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --package incodex-cli --bin incodex
          cargo build --locked --release --target x86_64-apple-darwin --package incodex-cli --bin incodex
          rm -rf release-cli
          mkdir -p release-cli
          install -m 755 target/aarch64-apple-darwin/release/incodex release-cli/incodex-darwin-arm64
          install -m 755 target/x86_64-apple-darwin/release/incodex release-cli/incodex-darwin-x64
          codesign --sign - --force release-cli/incodex-darwin-arm64
          codesign --sign - --force release-cli/incodex-darwin-x64
          file release-cli/incodex-darwin-arm64
          file release-cli/incodex-darwin-x64
          lipo release-cli/incodex-darwin-arm64 -verify_arch arm64
          lipo release-cli/incodex-darwin-x64 -verify_arch x86_64
          codesign --verify --strict release-cli/incodex-darwin-arm64
          codesign --verify --strict release-cli/incodex-darwin-x64
      - name: Smoke final asset behavior
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) ;;
            *) echo "release asset behavior smoke requires an arm64 host: $(uname -m)" >&2; exit 1 ;;
          esac
          ARM_BINARY="release-cli/incodex-darwin-arm64"
          X64_BINARY="release-cli/incodex-darwin-x64"
          INCODEX_RELEASE_BINARY="$PWD/$ARM_BINARY" INCODEX_RELEASE_ARCH="arm64" cargo test --locked --release --package incodex-cli --test release_asset_smoke \
            -- --ignored --exact release_asset_behavior_smoke
          INCODEX_RELEASE_BINARY="$PWD/$X64_BINARY" INCODEX_RELEASE_ARCH="x86_64" cargo test --locked --release --package incodex-cli --test release_asset_smoke \
            -- --ignored --exact release_asset_behavior_smoke
      - name: Smoke test both stable Runtime publishers
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) ;;
            *) echo "release smoke requires an arm64 host: $(uname -m)" >&2; exit 1 ;;
          esac
          ARM_BINARY="release-cli/incodex-darwin-arm64"
          X64_BINARY="release-cli/incodex-darwin-x64"
          "$ARM_BINARY" --version
          "$ARM_BINARY" --help >/dev/null
          /usr/bin/arch -x86_64 "$X64_BINARY" --version
          /usr/bin/arch -x86_64 "$X64_BINARY" --help >/dev/null
          ARM_SMOKE_HOME="$(mktemp -d)"
          X64_SMOKE_HOME="$(mktemp -d)"
          trap 'rm -rf "$ARM_SMOKE_HOME" "$X64_SMOKE_HOME"' EXIT
          HOME="$ARM_SMOKE_HOME" "$ARM_BINARY" runtime
          HOME="$X64_SMOKE_HOME" /usr/bin/arch -x86_64 "$X64_BINARY" runtime
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          verify_runtime_pointer() {
            SMOKE_HOME="$1" EXPECTED_VERSION="$VERSION" EXPECTED_SOURCE_COMMIT="$GITHUB_SHA" bun -e '
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              const path = require("node:path");
              const REQUIRED_MANIFEST_FILES = [
                "incodex-main.cjs",
                "incodex-preload.cjs",
                "incodex-inject.js",
                "incodex-safe-home.cjs",
                "incodex-ipc-guard.cjs",
                "incodex-owner-core.cjs",
                "incodex-owner-recovery.cjs",
                "incodex-instance.cjs",
                "incodex-window-kind.cjs",
                "incodex-runtime-load.cjs",
                "incodex-loader.cjs",
              ];
              const REQUIRED_EXTERNAL_FILES = [
                ...REQUIRED_MANIFEST_FILES.filter((name) => name !== "incodex-loader.cjs"),
              ];
              const root = path.join(process.env.SMOKE_HOME, ".incodex", "runtime");
              const current = JSON.parse(fs.readFileSync(path.join(root, "current.json"), "utf8"));
              if (current.schemaVersion !== 1 || current.version !== process.env.EXPECTED_VERSION) throw new Error("invalid runtime pointer");
              if (current.sourceCommit !== process.env.EXPECTED_SOURCE_COMMIT) throw new Error("runtime pointer provenance mismatch");
              if (!/^[0-9a-f]{64}$/.test(current.manifestSha256)) throw new Error("invalid manifestSha256");
              if (current.release !== `releases/${current.version}-${current.manifestSha256}`) throw new Error("runtime release name mismatch");
              const release = path.join(root, current.release);
              const manifestPath = path.join(release, "runtime-manifest.json");
              const manifestBytes = fs.readFileSync(manifestPath);
              const manifestHash = crypto.createHash("sha256").update(manifestBytes).digest("hex");
              if (manifestHash !== current.manifestSha256) throw new Error("runtime manifest hash mismatch");
              const manifest = JSON.parse(manifestBytes);
              if (manifest.runtimeVersion !== current.version || manifest.sourceCommit !== current.sourceCommit) throw new Error("runtime manifest provenance mismatch");
              const currentFileNames = Object.keys(current.files || {}).sort();
              const manifestFileNames = Object.keys(manifest.files || {}).sort();
              const loaderManifestHash = manifest.files["incodex-loader.cjs"];
              if (
                currentFileNames.join("\0") !== REQUIRED_EXTERNAL_FILES.slice().sort().join("\0") ||
                manifestFileNames.join("\0") !== REQUIRED_MANIFEST_FILES.slice().sort().join("\0")
              ) throw new Error("runtime file set mismatch");
              if (!/^[0-9a-f]{64}$/.test(loaderManifestHash)) throw new Error("invalid loader manifest hash");
              for (const name of REQUIRED_EXTERNAL_FILES) {
                const expected = current.files[name];
                if (!/^[0-9a-f]{64}$/.test(expected) || manifest.files[name] !== expected) throw new Error(`runtime pointer hash mismatch: ${name}`);
                const actual = crypto.createHash("sha256").update(fs.readFileSync(path.join(release, name))).digest("hex");
                if (actual !== expected) throw new Error(`runtime file hash mismatch: ${name}`);
              }
            '
          }
          verify_runtime_pointer "$ARM_SMOKE_HOME"
          verify_runtime_pointer "$X64_SMOKE_HOME"
      - name: Checksums
        run: |
          set -euo pipefail
          (cd release-cli && shasum -a 256 incodex-darwin-arm64 incodex-darwin-x64 > SHA256SUMS)
          cat release-cli/SHA256SUMS
          ACTUAL_ASSETS=$(find release-cli -type f -exec basename {} \; | LC_ALL=C sort)
          EXPECTED_ASSETS=$(printf '%s\n' SHA256SUMS incodex-darwin-arm64 incodex-darwin-x64 | LC_ALL=C sort)
          if [[ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]]; then
            echo "unexpected release asset set" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED_ASSETS" "$ACTUAL_ASSETS" >&2
            exit 1
          fi
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-cli/incodex-darwin-arm64
            release-cli/incodex-darwin-x64
            release-cli/SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Asset publication is phase one; follow .claude/skills/release-notes/SKILL.md to publish handwritten notes.
          generate_release_notes: false
          files: |
            release-cli/incodex-darwin-arm64
            release-cli/incodex-darwin-x64
            release-cli/SHA256SUMS

  update-formula:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version from tag
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag_version.outputs.tag }}
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set" >&2
            exit 1
          fi

          SHA256SUMS=/tmp/incodex-SHA256SUMS
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL -o "$SHA256SUMS" "https://github.com/daftAI2026/incodex/releases/download/${TAG}/SHA256SUMS"; then
              break
            fi
            sleep 5
          done
          ARM_SHA=$(awk '$2 == "incodex-darwin-arm64" { print $1 }' "$SHA256SUMS")
          X64_SHA=$(awk '$2 == "incodex-darwin-x64" { print $1 }' "$SHA256SUMS")
          if [[ -z "$ARM_SHA" || -z "$X64_SHA" ]]; then
            echo "Failed to resolve release checksums" >&2
            cat "$SHA256SUMS" >&2 || true
            exit 1
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/daftAI2026/homebrew-tap.git" /tmp/homebrew-tap
          ./scripts/update-homebrew-tap-formula.sh \
            --formula /tmp/homebrew-tap/Formula/incodex.rb \
            --tag "${TAG}" \
            --arm-sha "${ARM_SHA}" \
            --x64-sha "${X64_SHA}"

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Formula/incodex.rb; then
            echo "No Homebrew formula changes to push"
            exit 0
          fi

          git add Formula/incodex.rb
          git commit -m "incodex ${VERSION}" -m "Automated release via GitHub Actions"
          git push origin HEAD:main
