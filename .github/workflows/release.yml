name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build and check
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bun run build:runtime
          bun run typecheck
          bun run lint
          bun test src tests
      - name: Compile CLI
        run: |
          mkdir -p release-cli
          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile release-cli/incodex-darwin-arm64
          bun build src/cli.ts --compile --target=bun-darwin-x64 --outfile release-cli/incodex-darwin-x64
          codesign --sign - --force release-cli/incodex-darwin-arm64
          codesign --sign - --force release-cli/incodex-darwin-x64
      - name: Checksums
        run: |
          (cd release-cli && shasum -a 256 incodex-darwin-arm64 incodex-darwin-x64 > SHA256SUMS)
          cat release-cli/SHA256SUMS
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-cli/incodex-darwin-arm64
            release-cli/incodex-darwin-x64
            release-cli/SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: false
          files: |
            release-cli/incodex-darwin-arm64
            release-cli/incodex-darwin-x64
            release-cli/SHA256SUMS
