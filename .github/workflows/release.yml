name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build and check
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bun run build:runtime
          bun run typecheck
          bun run lint
          bun test src tests
      - name: Checksums
        run: |
          {
            echo "# Incodex ${GITHUB_REF_NAME}"
            echo "commit ${GITHUB_SHA}"
            find dist -type f | sort | while read -r file; do
              shasum -a 256 "$file"
            done
            shasum -a 256 package.json bun.lock LICENSE
          } > checksums.txt
          cat checksums.txt
      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            checksums.txt
            dist/runtime-manifest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            checksums.txt
            dist/runtime-manifest.json
