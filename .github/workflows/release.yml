name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build and check
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bun run build:runtime
          bun run typecheck
          bun run lint
          bun test src tests
      - name: Compile CLI
        run: |
          mkdir -p release-cli
          bun build src/cli.ts --compile --target=bun-darwin-arm64 --outfile release-cli/incodex-darwin-arm64
          bun build src/cli.ts --compile --target=bun-darwin-x64 --outfile release-cli/incodex-darwin-x64
          codesign --sign - --force release-cli/incodex-darwin-arm64
          codesign --sign - --force release-cli/incodex-darwin-x64
      - name: Checksums
        run: |
          (cd release-cli && shasum -a 256 incodex-darwin-arm64 incodex-darwin-x64 > SHA256SUMS)
          cat release-cli/SHA256SUMS
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-cli/incodex-darwin-arm64
            release-cli/incodex-darwin-x64
            release-cli/SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: false
          files: |
            release-cli/incodex-darwin-arm64
            release-cli/incodex-darwin-x64
            release-cli/SHA256SUMS

  update-formula:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version from tag
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag_version.outputs.tag }}
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set" >&2
            exit 1
          fi

          SHA256SUMS=/tmp/incodex-SHA256SUMS
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL -o "$SHA256SUMS" "https://github.com/daftAI2026/incodex/releases/download/${TAG}/SHA256SUMS"; then
              break
            fi
            sleep 5
          done
          ARM_SHA=$(awk '$2 == "incodex-darwin-arm64" { print $1 }' "$SHA256SUMS")
          X64_SHA=$(awk '$2 == "incodex-darwin-x64" { print $1 }' "$SHA256SUMS")
          if [[ -z "$ARM_SHA" || -z "$X64_SHA" ]]; then
            echo "Failed to resolve release checksums" >&2
            cat "$SHA256SUMS" >&2 || true
            exit 1
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/daftAI2026/homebrew-tap.git" /tmp/homebrew-tap
          ./scripts/update-homebrew-tap-formula.sh \
            --formula /tmp/homebrew-tap/Formula/incodex.rb \
            --tag "${TAG}" \
            --arm-sha "${ARM_SHA}" \
            --x64-sha "${X64_SHA}"

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Formula/incodex.rb; then
            echo "No Homebrew formula changes to push"
            exit 0
          fi

          git add Formula/incodex.rb
          git commit -m "incodex ${VERSION}" -m "Automated release via GitHub Actions"
          git push origin HEAD:main
