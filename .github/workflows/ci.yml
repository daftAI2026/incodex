name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Classify changed paths
        id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_MERGE_BASE: ${{ github.event_name == 'pull_request' }}
        run: bun scripts/ci-change-scope.ts

  quality:
    needs: changes
    if: needs.changes.outputs.product != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Runtime artifact consistency
        run: bun run check:dist
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: "false"
      - name: Cargo formatting
        run: cargo fmt --all -- --check
      - name: Audit
        run: bun run audit

  macos-runtime:
    needs: changes
    if: needs.changes.outputs.product != 'false'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Shared Runtime on macOS
        if: matrix.shard == 0
        run: bun run test:shared
      - name: Native macOS Runtime shard
        run: bun scripts/ci-test-shard.ts ${{ matrix.shard }} 2

  check:
    if: always()
    needs: [changes, quality, macos-runtime, cargo, windows-cargo]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable product gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const docsOnly = needs.changes.result === "success" && needs.changes.outputs.product === "false";
          const ok = needs.changes.result === "success" && (docsOnly ||
            Object.entries(needs).filter(([name]) => name !== "changes").every(([, job]) => job.result === "success"));
          if (!ok) { console.error(needs); process.exit(1); }
          console.log(docsOnly ? "Documentation-only change" : "All product gates passed");
          JS

  cargo:
    needs: changes
    if: needs.changes.outputs.product != 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          # The setup action uses Swatinem/rust-cache; retain workspace outputs too.
          cache-workspace-crates: "true"
          cache-bin: "false"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install prebuilt test runner
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151
      - name: Compile release tests
        run: cargo nextest run --workspace --release --locked --no-run
      - name: Run release tests
        # Process identity and PTY tests retain the original libtest environment below.
        run: >-
          cargo nextest run --workspace --release --locked --no-fail-fast
          -E 'not (binary_id(=incodex-cli::tty_harness) or (package(=incodex-cli) and test(=app_quiescence::tests::restore_preflight_classifies_the_actual_current_process_as_busy)))'
      - name: Process identity and PTY tests
        run: |
          cargo test -p incodex-cli --lib --release --locked app_quiescence::tests::restore_preflight_classifies_the_actual_current_process_as_busy -- --exact
          cargo test -p incodex-cli --test tty_harness --release --locked
      - name: Run documentation tests
        run: cargo test --workspace --release --locked --doc

  windows-cargo:
    needs: changes
    if: needs.changes.outputs.product != 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          # The setup action uses Swatinem/rust-cache; retain workspace outputs too.
          cache-workspace-crates: "true"
          cache-bin: "false"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Shared Windows Runtime boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run test:shared
          bun run test:windows
      - name: Windows CLI boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run test:windows:rust
          bun scripts/build-windows-release.ts
