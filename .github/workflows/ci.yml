name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Classify changed paths
        id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_MERGE_BASE: ${{ github.event_name == 'pull_request' }}
        run: bun scripts/ci-change-scope.ts

  check:
    needs: changes
    if: ${{ always() && needs.changes.outputs.product != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, test, dist
        run: bun run check
      - name: Audit
        run: bun run audit

  cargo:
    needs: changes
    if: ${{ always() && needs.changes.outputs.product != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cargo quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --release --locked

  windows-cargo:
    needs: changes
    if: ${{ always() && needs.changes.outputs.product != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Shared Windows Runtime boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run typecheck
          bun run lint
          bun run check:dist
          bun run test:shared
          bun run test:windows
      - name: Windows CLI boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run test:windows:rust
          bun scripts/build-windows-release.ts
