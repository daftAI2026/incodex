name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, test, dist
        run: bun run check
      - name: Audit
        run: bun run audit

  cargo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Cargo quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --release --locked

  windows-cargo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Shared Windows Runtime boundary
        run: |
          bun run typecheck
          bun run lint
          bun run check:dist
          bun test src/runtime/windows-platform.test.ts
          bun test src/runtime-load.test.ts tests/windows-bootstrap.test.ts
      - name: Windows CLI boundary
        run: |
          cargo fmt --all -- --check
          cargo clippy -p incodex-core --lib --locked -- -D warnings
          cargo clippy -p incodex-cli --lib --bin incodex --locked -- -D warnings
          cargo test -p incodex-core --lib --release --locked
          cargo test -p incodex-core --test windows_paths --release --locked
          cargo test -p incodex-core --test windows_session --release --locked
          cargo test -p incodex-cli --lib --release --locked
          cargo test -p incodex-cli --test windows_activation --release --locked
          cargo test -p incodex-cli --test windows_app --release --locked
          cargo test -p incodex-cli --test windows_cdp --release --locked
          cargo test -p incodex-cli --test windows_helper --release --locked
          cargo test -p incodex-cli --test windows_install_state --release --locked
          cargo test -p incodex-cli --test windows_open --release --locked
          cargo test -p incodex-cli --test windows_process --release --locked
          cargo test -p incodex-cli --test windows_platform --release --locked
          cargo test -p incodex-cli --test windows_runtime --release --locked
          cargo test -p incodex-cli --test windows_runtime_open --release --locked
