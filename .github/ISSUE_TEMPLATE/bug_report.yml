name: Bug Report
description: Report a bug in Incodex
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this may allow patching the wrong app, skipping confirmation, or breaking session isolation, do not file a public issue. Use GitHub Security Advisories instead. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands and clicks, in order.
      value: |
        1. Run `incodex …`
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: incodex doctor
      description: Paste the output of `incodex doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: incodex-version
    attributes:
      label: Incodex version
      description: Output of `incodex --version`, or the git commit.
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex / ChatGPT desktop version
      description: CFBundleShortVersionString and CFBundleVersion if you have them.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Which app did you install into?
      options:
        - Official /Applications/ChatGPT.app
        - Clone (~/.incodex/scratch/ChatGPT.app)
        - Custom --app path
        - Did not install (CLI only)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
