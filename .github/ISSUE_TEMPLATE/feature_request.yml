name: Feature Request
description: Suggest a change to Incodex
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Incodex do instead?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where would this show up?
      options:
        - CLI command / menu
        - Hat button / incognito window
        - Install / uninstall
        - Docs
        - Not sure
    validations:
      required: true
