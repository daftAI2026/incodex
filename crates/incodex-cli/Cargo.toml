[package]
name = "incodex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Incodex native CLI"

[[bin]]
name = "incodex"
path = "src/main.rs"

[dependencies]
incodex-core = { path = "../incodex-core" }

[target.'cfg(target_os = "windows")'.dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tungstenite.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
incodex-asar = { path = "../incodex-asar" }
incodex-macos = { path = "../incodex-macos" }
incodex-runtime-bundle = { path = "../incodex-runtime-bundle" }
incodex-transaction = { path = "../incodex-transaction" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tungstenite.workspace = true
