[package]
name = "incodex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Incodex native CLI"

[[bin]]
name = "incodex"
path = "src/main.rs"

[dependencies]
incodex-core = { path = "../incodex-core" }

[target.'cfg(target_os = "windows")'.dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
incodex-asar = { path = "../incodex-asar" }
incodex-macos = { path = "../incodex-macos" }
incodex-runtime-bundle = { path = "../incodex-runtime-bundle" }
incodex-transaction = { path = "../incodex-transaction" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tungstenite.workspace = true
