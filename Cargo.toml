[workspace]
resolver = "2"
members = [
    "crates/incodex-cli",
    "crates/incodex-core",
    "crates/incodex-transaction",
    "crates/incodex-macos",
    "crates/incodex-runtime-bundle",
    "crates/incodex-asar",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/daftAI2026/incodex"

[workspace.dependencies]
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tungstenite = { version = "0.24.0", default-features = false, features = ["handshake"] }
