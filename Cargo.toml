[workspace]
resolver = "2"
members = [
    "crates/incodex-cli",
    "crates/incodex-core",
    "crates/incodex-transaction",
    "crates/incodex-macos",
    "crates/incodex-runtime-bundle",
    "crates/incodex-asar",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/daftAI2026/incodex"

[workspace.dependencies]
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
windows-sys = "0.61.2"
