<!--
 * [INPUT]: 依赖真实 macOS 窗口核对与 Runtime 首页通知槽。
 * [OUTPUT]: 展示侧栏顶部、最左导航栏与输入框上方的位置。
 * [POS]: 双语窗口指南的静态示意，不复制私人对话截图。
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">窗口入口的位置</title>
<desc id="desc">按真实 macOS 窗口布局绘制 · 位置示意，非截图. 1. 帽子位于左侧栏顶部，搜索工具栏操作组最前端。 2. 支持布局中才会出现最左侧的可选侧栏入口。 3. 通知条只显示在私密窗口首页，位于输入框上方。</desc>
