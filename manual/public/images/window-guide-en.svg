 <g id="search" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></g>
 <g id="bell" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 16h14l-2-4V9a5 5 0 0 0-10 0v3z M10 20h4"/></g>
</defs>
<rect width="1000" height="1060" rx="18" fill="#f4f4f2"/>
