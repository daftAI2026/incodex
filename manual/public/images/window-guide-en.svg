<!--
 * [INPUT]: 依赖真实 macOS 窗口核对与 Runtime 首页通知槽。
 * [OUTPUT]: 展示侧栏顶部、最左导航栏与输入框上方的位置。
 * [POS]: 双语窗口指南的静态示意，不复制私人对话截图。
 * [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Where to find the controls</title>
<desc id="desc">Based on the observed macOS layout · Position diagram, not a screenshot. 1. Sidebar header: leading edge of Search's toolbar action group. 2. Optional left-rail sidebar entry, in a supported sidebar slot only. 3. The home notification is above the composer in the private window.</desc>
<defs>
