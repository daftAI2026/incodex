<text data-copy-role="toolbar" x="30" y="908" font-size="20" font-weight="600">1. Sidebar header: leading edge of Search's toolbar action group.</text>
<text data-copy-role="sidebar" x="30" y="941" font-size="20">2. Optional left-rail sidebar entry, in a supported sidebar slot only.</text>
<text data-copy-role="banner" x="30" y="974" font-size="20">3. The home notification is above the composer in the private window.</text>
<path d="M30 998h940" stroke="#d8d8d4"/>
<text data-copy-role="lifecycle" x="30" y="1033" font-size="20">Normal close clears the private session. Minimize keeps the session.</text>
